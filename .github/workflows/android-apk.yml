name: Build AZAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # دریافت سورس پروژه
      - name: Get project
        uses: actions/checkout@v4

      # نصب Java
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # نصب Flutter
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # ایجاد فایل‌های اندروید
      - name: Create Android files
        run: flutter create . --platforms=android --org ir.azar --project-name azar

      # راه‌اندازی Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # نصب Android SDK نسخه 36
      - name: Install Android SDK Platform 36
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      # تنظیم قطعی compileSdk روی نسخه 36
      - name: Set compileSdk to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          gradle_file = next(
              (f for f in files if f.exists()),
              None
          )

          if gradle_file is None:
              raise SystemExit("Android Gradle file not found")

          content = gradle_file.read_text()

          pattern = (
              r'(?m)^(\s*compileSdk(?:Version)?\s*'
              r'(?:=\s*)?)(?:flutter\.compileSdkVersion|\d+)\b.*$'
          )

          updated, count = re.subn(
              pattern,
              r'\g<1>36',
              content
          )

          if count == 0:
              raise SystemExit(
                  "ERROR: Could not find compileSdk setting"
              )

          gradle_file.write_text(updated)

          print("Updated file:", gradle_file)
          print("compileSdk successfully set to 36")

          for line in updated.splitlines():
              if "compileSdk" in line:
                  print(line)

          if not re.search(
              r'(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?36\b',
              updated
          ):
              raise SystemExit(
                  "ERROR: compileSdk verification failed"
              )
          PY

      # دریافت وابستگی‌ها
      - name: Get dependencies
        run: flutter pub get

      # بررسی تنظیمات قبل از ساخت APK
      - name: Verify Android configuration
        run: |
          echo "Checking Android Gradle configuration..."
          grep -n "compileSdk" android/app/build.gradle* || true
          echo "Flutter version:"
          flutter --version

      # ساخت APK
      - name: Build APK
        run: flutter build apk --debug

      # ذخیره فایل APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AZAR-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
